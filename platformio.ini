; Define um ambiente de build chamado esp32.
[env:esp32dev]

; Diz ao PlatformIO qual plataforma de hardware usar
platform = espressif32

; Especifica a placa exata dentro da plataforma Espress
board = esp32dev

; Diz pra usar o framework Arduino (as funções setup(), loop(), digitalWrite(), etc.).
; É isso que permite reaproveitar bibliotecas Arduino como SoftwareSerial.
framework = arduino

;Define a baud rate do Monitor Serial do PlatformIO
monitor_speed = 115200