; Define um ambiente de build chamado esp12e.
[env:esp12e]

; Diz ao PlatformIO qual plataforma de hardware usar (mudou para espressif8266)
platform = espressif8266

; Especifica a placa exata para o ESP-12E
board = esp12e

; Mantém o framework Arduino para reaproveitar as funções padrão.
framework = arduino

; Define a baud rate do Monitor Serial do PlatformIO
monitor_speed = 115200
